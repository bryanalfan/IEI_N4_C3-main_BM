<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 12vh;
            background: #f4f4f9;
            color: #222;
        }
        .error {
            max-width: 650px;
            margin: auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }
        h1 { font-size: 72px; margin: 0; color: #092e20; }
        a { display: inline-block; margin-top: 20px; text-decoration: none; padding: 10px 18px; border-radius: 8px; background: #092e20; color: white; }
    </style>
</head>
<body>
    <div class="error">
        <h1>404</h1>
        <h2>Página no encontrada</h2>
        <p>La dirección solicitada no existe en esta aplicación.</p>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
